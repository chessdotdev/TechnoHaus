<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechnoHaus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/style/style.css">
  <link rel="stylesheet" href="../assets/style/mobile.css">
</head>
<body>

  <div class="glow-orb"></div>

  <div class="auth-wrapper">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">
        <i class="bi bi-cpu-fill"></i> TECHNOHAUS
      </div>
      <div class="brand-sub">NEXT-GEN PC BUILDS</div>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">
          <i class="bi bi-box-arrow-in-right"></i> LOGIN
        </button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">
          <i class="bi bi-person-plus"></i> REGISTER
        </button>
      </div>

      <!-- ── LOGIN PANEL ── -->
      <div class="form-panel active" id="panel-login">
        <form id="login-form">

          <div class="section-label"><i class="bi bi-shield-lock"></i> CREDENTIALS</div>

          <div class="input-group">
            <i class="bi bi-person icon"></i>
            <input type="text" id="login-username" placeholder="Username" >
          </div>

          <div class="input-group">
            <i class="bi bi-lock icon"></i>
            <input type="password" id="login-password" placeholder="Password">
            <i class="bi bi-eye toggle-pw" onclick="togglePw('login-password', this)"></i>
          </div>

          <div class="forgot">
            <a href="#">Forgot Password?</a>
          </div>

          <div class="error-msg" id="login-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="login-error-text"></span>
          </div>

          <button type="submit" class="btn-submit" id="login-btn">
            <i class="bi bi-box-arrow-in-right"></i> LOGIN
          </button>

        </form>
      </div>

      <!-- REGISTER PANEL -->
      <div class="form-panel register-panel" id="panel-register">
        <form id="register-form">

          <div class="section-label"><i class="bi bi-person-badge"></i> ACCOUNT</div>

          <div class="input-group">
            <i class="bi bi-person icon"></i>
            <input type="text" id="register-username" placeholder="Username" >
          </div>

          <div class="input-group">
            <i class="bi bi-lock icon"></i>
            <input type="password" id="register-password" placeholder="Password">
            <i class="bi bi-eye toggle-pw" onclick="togglePw('register-password', this)"></i>
          </div>

          <div class="section-label"><i class="bi bi-info-circle"></i> PERSONAL INFO</div>

          <div class="input-group">
            <i class="bi bi-person-vcard icon"></i>
            <input type="text" id="register-fullname" placeholder="Full Name">
          </div>

          <div class="input-group">
            <i class="bi bi-envelope icon"></i>
            <input type="email" id="register-email" placeholder="Email (optional)">
          </div>

          <div class="input-group">
            <i class="bi bi-telephone icon"></i>
            <input type="tel" id="register-phone" placeholder="Phone Number" >
          </div>

          <div class="section-label"><i class="bi bi-geo-alt"></i> SHIPPING ADDRESS</div>

          <div class="input-group">
            <i class="bi bi-house icon"></i>
            <input type="text" id="register-street" placeholder="Street">
          </div>

          <div class="input-row">
            <div class="input-group">
              <i class="bi bi-building icon"></i>
              <input type="text" id="register-city" placeholder="City">
            </div>
            <div class="input-group">
              <i class="bi bi-map icon"></i>
              <input type="text" id="register-province" placeholder="Province">
            </div>
          </div>

          <div class="input-group">
            <i class="bi bi-mailbox icon"></i>
            <input type="text" id="register-zipcode" placeholder="Zip Code">
          </div>

          <div class="error-msg" id="register-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="register-error-text"></span>
          </div>

          <div class="success-msg" id="register-success">
            <i class="bi bi-check-circle-fill"></i>
            <span>Registration successful! Please login.</span>
          </div>

          <button type="submit" class="btn-submit" id="register-btn">
            <i class="bi bi-person-check"></i> CREATE ACCOUNT
          </button>

        </form>
      </div>

      <!-- Footer -->
      <div class="auth-footer">
        <i class="bi bi-shield-check"></i> SECURED CONNECTION
      </div>

    </div>
  </div>

  <script src="assets/script/index.js"></script>
</body>
</html>
