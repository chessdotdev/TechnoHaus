<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechnoHaus – Next-gen AI-powered PC builder and e-commerce platform.">
  <meta name="theme-color" content="#00d4ff">
  <meta name="author" content="TechnoHaus">
  <meta property="og:title" content="TechnoHaus">
  <meta property="og:description" content="Next-gen AI-powered PC builder and e-commerce platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://technohaus.onrender.com">
  <meta name="application-name" content="TechnoHaus">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TechnoHaus">
  <link rel="icon" type="image/x-icon" href="../assets/image/favicon/technohauslogo.jpg"> 
  <title>Profile – TechnoHaus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/style/global.css">
  <link rel="stylesheet" href="../assets/style/profile.css">
  <link rel="stylesheet" href="../assets/style/mobile.css">
</head>
<body>

  <!-- Desktop Top Bar -->
  <div class="top-bar">
    <div class="top-left">
      <a href="/product" class="back-link"><i class="bi bi-arrow-left"></i> Back</a>
      <a href="/product" class="logo"><i class="bi bi-cpu-fill"></i> TECHNOHAUS</a>
    </div>
    <div class="top-right">
      <a href="/cart" class="cart-link">
        <i class="bi bi-cart3"></i>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
      <button class="btn-logout" id="logoutBtnTop">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="/product" class="bnav-item">
        <i class="bi bi-grid-3x3-gap-fill"></i>Products
      </a>
      <a href="/pcbuilder" class="bnav-item">
        <i class="bi bi-stars"></i>AI BUILD
      </a>
      <a href="/cart" class="bnav-item">
        <span class="bnav-badge" id="cart-count-mobile">0</span>
        <i class="bi bi-cart3"></i>CART
      </a>
      <a href="/profile" class="bnav-item active">
        <i class="bi bi-person-circle"></i>PROFILE
      </a>
    </div>
  </nav>

  <div class="main">

    <!-- Page header -->
    <div class="page-header">
      <div class="page-pill"><i class="bi bi-person-circle"></i> PROFILE</div>
      <h1>My Profile</h1>
    </div>

    <!-- Loading skeleton -->
    <div id="loading-state">
      <div class="avatar-card">
        <div class="skeleton avatar-skel"></div>
        <div style="flex:1">
          <div class="skeleton mb-2" style="height:14px;width:50%"></div>
          <div class="skeleton mb-2" style="height:11px;width:35%"></div>
          <div class="skeleton" style="height:20px;width:80px;border-radius:20px"></div>
        </div>
      </div>
      <div class="info-card">
        <div class="skeleton mb-4" style="height:12px;width:40%"></div>
        <div class="skeleton mb-3" style="height:12px"></div>
        <div class="skeleton mb-3" style="height:12px;width:80%"></div>
        <div class="skeleton" style="height:12px;width:70%"></div>
      </div>
      <div class="info-card">
        <div class="skeleton mb-4" style="height:12px;width:40%"></div>
        <div class="skeleton mb-3" style="height:12px"></div>
        <div class="skeleton mb-3" style="height:12px;width:75%"></div>
        <div class="skeleton mb-3" style="height:12px;width:60%"></div>
        <div class="skeleton" style="height:12px;width:50%"></div>
      </div>
    </div>

    <!-- Profile Content -->
    <div id="profile-content" style="display:none">

      <!-- Avatar Card -->
      <div class="avatar-card">
        <div class="avatar" id="avatar-initials">?</div>
        <div class="avatar-info">
          <div class="avatar-name" id="profile-fullname">—</div>
          <div class="avatar-username" id="profile-username">@—</div>
          <div class="role-badge">
            <i class="bi bi-shield-check"></i>
            <span id="profile-role">—</span>
          </div>
        </div>
      </div>

      <!-- Contact Info -->
      <div class="info-card" style="animation-delay:.1s">
        <div class="info-card-title">
          <i class="bi bi-person-lines-fill"></i> CONTACT INFO
        </div>
        <div class="info-row">
          <i class="bi bi-envelope"></i>
          <span class="info-label">EMAIL</span>
          <span class="info-value" id="profile-email">—</span>
        </div>
        <div class="info-row">
          <i class="bi bi-telephone"></i>
          <span class="info-label">PHONE</span>
          <span class="info-value" id="profile-phone">—</span>
        </div>
      </div>

      <!-- Shipping Address -->
      <div class="info-card" style="animation-delay:.15s">
        <div class="info-card-title">
          <i class="bi bi-geo-alt-fill"></i> SHIPPING ADDRESS
        </div>
        <div class="info-row">
          <i class="bi bi-house"></i>
          <span class="info-label">STREET</span>
          <span class="info-value" id="profile-street">—</span>
        </div>
        <div class="info-row">
          <i class="bi bi-building"></i>
          <span class="info-label">CITY</span>
          <span class="info-value" id="profile-city">—</span>
        </div>
        <div class="info-row">
          <i class="bi bi-map"></i>
          <span class="info-label">PROVINCE</span>
          <span class="info-value" id="profile-province">—</span>
        </div>
        <div class="info-row">
          <i class="bi bi-mailbox"></i>
          <span class="info-label">ZIP CODE</span>
          <span class="info-value" id="profile-zipcode">—</span>
        </div>
        <div class="info-row">
          <i class="bi bi-globe"></i>
          <span class="info-label">COUNTRY</span>
          <span class="info-value" id="profile-country">Philippines</span>
        </div>
      </div>

      <!-- Account Info -->
      <div class="info-card" style="animation-delay:.2s">
        <div class="info-card-title">
          <i class="bi bi-calendar3"></i> ACCOUNT
        </div>
        <div class="info-row">
          <i class="bi bi-clock-history"></i>
          <span class="info-label">JOINED</span>
          <span class="info-value" id="profile-joined">—</span>
        </div>
        <div class="info-row">
          <i class="bi bi-arrow-clockwise"></i>
          <span class="info-label">UPDATED</span>
          <span class="info-value" id="profile-updated">—</span>
        </div>
      </div>

      <!-- Logout Button -->
      <button class="btn-logout-full" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> LOGOUT
      </button>

    </div>

    <!-- Error State -->
    <div id="error-state" style="display:none" class="error-state">
      <i class="bi bi-exclamation-triangle"></i>
      <div class="error-title">FAILED TO LOAD PROFILE</div>
      <p>Check your connection and try again.</p>
      <button onclick="loadProfile()" class="btn-retry">RETRY</button>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script src="../assets/script/profile.js"></script>
</body>
</html>
