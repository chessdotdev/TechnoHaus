<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PC Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/style/global.css">
  <link rel="stylesheet" href="../assets/style/pcbuilder.css">
  <link rel="stylesheet" href="../assets/style/mobile.css">
</head>
<body>

  <!-- Desktop  -->
  <div class="top-bar">
    <a href="/pcbuilder" class="logo">
      <i class="bi bi-cpu-fill"></i> AI PC BUILDER
    </a>
    <div class="top-right">
      <a href="/product" class="nav-link"><i class="bi bi-grid"></i> Products</a>
      <a href="/cart" class="nav-link"><i class="bi bi-cart3"></i> Cart</a>
      <button class="btn-logout" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>

    <!-- Mobile -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a href="/product" class="bnav-item">
          <i class="bi bi-grid-3x3-gap-fill"></i>Products
        </a>
        <a href="/pcbuilder" class="bnav-item active">
          <i class="bi bi-stars"></i>AI BUILD
        </a>
        <a href="/cart" class="bnav-item">
          <span class="bnav-badge" id="cart-count-mobile">0</span>
          <i class="bi bi-cart3"></i>CART
        </a>
        <a href="/profile" class="bnav-item">
          <i class="bi bi-person-circle"></i>PROFILE
        </a>
      </div>
    </nav>

  <div class="main">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-pill">
        <i class="bi bi-stars"></i> POWERED BY AI
      </div>
      <h1>Build Your Perfect PC</h1>
      <p>Enter your budget and describe what you need. Our AI will engineer the ideal build tailored just for you.</p>
    </div>

    <!-- Form -->
    <div class="form-card">

      <div class="field">
        <label class="field-label" for="budget">
          <i class="bi bi-cash-stack"></i> Budget (PHP)
        </label>
        <div class="input-wrap">
          <i class="bi bi-currency-exchange icon"></i>
          <input class="form-input" type="number" id="budget" placeholder="e.g. 30000"
            onkeydown="return !['e','E','+','-'].includes(event.key)" />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="description">
          <i class="bi bi-chat-text"></i> Description
        </label>
        <textarea class="form-textarea" id="description"
          placeholder="e.g. Gaming PC for 1080p, video editing workstation, budget office build..."></textarea>
      </div>

      <button class="btn-generate" onclick="generateBuild()" id="generateBtn">
        <i class="bi bi-lightning-fill" style="margin-right:0.5rem"></i>
        GENERATE MY BUILD
      </button>

    </div>

    <!-- Output (controlled by aibuilder.js + overridden below) -->
    <div id="output"></div>

  </div>

  <script src="../assets/script/aibuilder.js"></script>
</body>
</html>
