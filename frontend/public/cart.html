<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/style/cart.css">
  <link rel="stylesheet" href="../assets/style/mobile.css">
</head>
<body>

  <!-- Desktop  -->
  <div class="top-bar">
    <div class="top-left">
      <a href="/product" class="back-link"><i class="bi bi-arrow-left"></i> Back</a>
      <a href="/pcbuilder" class="logo"><i class="bi bi-cpu-fill"></i> AI PC BUILDER</a>
    </div>
    <div class="top-right">
      <div class="cart-info">
        <i class="bi bi-cart3"></i> MY CART
        <span class="cart-badge" id="cart-count">0</span>
      </div>
      <button class="btn-logout" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>

    <!-- Mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="/product" class="bnav-item">
        <i class="bi bi-grid-3x3-gap-fill"></i>Products
      </a>
      <a href="/pcbuilder" class="bnav-item">
        <i class="bi bi-stars"></i>AI BUILD
      </a>
      <a href="/cart" class="bnav-item active">
        <span class="bnav-badge" id="cart-count-mobile">0</span>
        <i class="bi bi-cart3"></i>CART
      </a>
      <a href="/profile" class="bnav-item">
        <i class="bi bi-person-circle"></i>PROFILE
      </a>
    </div>
  </nav>

  <div class="main">

    <!-- Page header -->
    <div class="page-header">
      <div class="page-pill"><i class="bi bi-cart3"></i> CART</div>
      <h1>My Cart</h1>
    </div>

    <!-- Loading skeleton -->
    <div id="loading-state">
      <div class="cart-layout">
        <div>
          <div class="skel-card">
            <div class="skeleton" style="width:110px;height:110px;flex-shrink:0;border-radius:10px"></div>
            <div style="flex:1">
              <div class="skeleton mb-2" style="height:13px;width:60%"></div>
              <div class="skeleton mb-1" style="height:10px;width:80%"></div>
              <div class="skeleton mb-1" style="height:10px;width:70%"></div>
              <div class="skeleton" style="height:10px;width:50%"></div>
            </div>
          </div>
          <div class="skel-card">
            <div class="skeleton" style="width:110px;height:110px;flex-shrink:0;border-radius:10px"></div>
            <div style="flex:1">
              <div class="skeleton mb-2" style="height:13px;width:55%"></div>
              <div class="skeleton mb-1" style="height:10px;width:75%"></div>
              <div class="skeleton" style="height:10px;width:60%"></div>
            </div>
          </div>
        </div>
        <div class="summary-card">
          <div class="skeleton mb-4" style="height:14px;width:50%"></div>
          <div class="skeleton mb-2" style="height:12px"></div>
          <div class="skeleton mb-2" style="height:12px;width:80%"></div>
          <div class="skeleton mb-4" style="height:12px;width:65%"></div>
          <div class="skeleton" style="height:44px;border-radius:10px"></div>
        </div>
      </div>
    </div>

    <!-- Cart content -->
    <div id="cart-content" style="display:none">
      <div class="cart-layout">
        <div id="cart-items-list"></div>
        <div class="summary-card">
          <div class="summary-title"><i class="bi bi-receipt" style="margin-right:0.5rem"></i>ORDER SUMMARY</div>
          <div id="summary-lines"></div>
          <div class="summary-total">
            <span class="summary-total-label">TOTAL</span>
            <span class="summary-total-value" id="summary-total">₱0.00</span>
          </div>
          <button class="btn-checkout" id="checkoutBtn">
            <i class="bi bi-bag-check"></i> PROCEED TO CHECKOUT
          </button>
          <a href="/product" class="btn-continue">
            <i class="bi bi-arrow-left"></i> CONTINUE SHOPPING
          </a>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" style="display:none">
      <div class="empty-state">
        <i class="bi bi-cart-x empty-icon"></i>
        <div class="empty-title">YOUR CART IS EMPTY</div>
        <p class="empty-sub">Looks like you haven't added any builds yet.</p>
        <a href="/product" class="btn-browse">
          <i class="bi bi-cpu-fill"></i> BROWSE BUILDS
        </a>
      </div>
    </div>

  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    const BASE_URL = '';

    // ---- Toast ----
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
      const el = document.createElement('div');
      el.className = `toast-item ${type}`;
      el.innerHTML = `<i class="bi ${icon}"></i> ${message}`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.3s ease';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    // ---- Format currency ----
    const fmt = (n) => new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(n || 0);

    // ---- Cart state ----
    let cartData = { items: [] };

    function getTotal() {
      return cartData.items.reduce((sum, item) => sum + (item.product?.price || 0) * item.quantity, 0);
    }

    function updateCartCount() {
      document.getElementById('cart-count').textContent = cartData.items.length;
      document.getElementById('cart-count-mobile').textContent = cartData.items.length;

    }

    // ---- Render summary ----
    function renderSummary() {
      const lines   = document.getElementById('summary-lines');
      const totalEl = document.getElementById('summary-total');

      lines.innerHTML = cartData.items.map(item => {
        const name  = item.product?.CPU || 'Custom Build';
        const price = item.product?.price || 0;
        return `
          <div class="summary-row">
            <span>${name} ×${item.quantity}</span>
            <span>${fmt(price * item.quantity)}</span>
          </div>`;
      }).join('');

      totalEl.textContent = fmt(getTotal());
    }

    // ---- Render cart ----
    function renderCart() {
      const list      = document.getElementById('cart-items-list');
      const content   = document.getElementById('cart-content');
      const emptyEl   = document.getElementById('empty-state');
      const loadingEl = document.getElementById('loading-state');

      loadingEl.style.display = 'none';

      if (!cartData.items || cartData.items.length === 0) {
        content.style.display = 'none';
        emptyEl.style.display = 'block';
        updateCartCount();
        return;
      }

      content.style.display = 'block';
      emptyEl.style.display = 'none';
      list.innerHTML = '';

      cartData.items.forEach((item, index) => {
        const p      = item.product || {};
        const price  = p.price || 0;
        const itemId = String(p._id || item.product);

        const card = document.createElement('div');
        card.className = 'cart-card';
        card.setAttribute('data-card-id', itemId);
        card.style.animationDelay = `${index * 80}ms`;

        card.innerHTML = `
          ${p.image
            ? `<img src="${p.image}" alt="${p.CPU || 'Build'}">`
            : `<div class="no-img-placeholder"><i class="bi bi-pc-display"></i></div>`
          }
          <div class="cart-item-body">
            <div class="item-title">${p.CPU || 'CUSTOM BUILD'}</div>
            <div class="specs-mini">
              ${p.GPU     ? `<span>GPU: ${p.GPU}</span>` : ''}
              ${p.RAM     ? `<span>RAM: ${p.RAM}</span>` : ''}
              ${p.STORAGE ? `<span>${p.STORAGE}</span>` : ''}
            </div>
            <div class="cart-item-footer">
              <div class="qty-control">
                <button class="qty-btn" data-action="decrease" data-id="${itemId}">−</button>
                <span class="qty-value">${item.quantity}</span>
                <button class="qty-btn" data-action="increase" data-id="${itemId}">+</button>
              </div>
              <div style="display:flex;align-items:center;gap:1rem">
                <span class="item-price">${fmt(price * item.quantity)}</span>
                <button class="btn-remove" data-id="${itemId}">
                  <i class="bi bi-trash"></i> Remove
                </button>
              </div>
            </div>
          </div>
        `;

        list.appendChild(card);
      });

      list.querySelectorAll('.qty-btn').forEach(btn => {
        btn.onclick = () => handleQuantity(btn.dataset.id, btn.dataset.action, btn);
      });

      list.querySelectorAll('.btn-remove').forEach(btn => {
        btn.onclick = () => handleRemove(btn.dataset.id, btn);
      });

      renderSummary();
      updateCartCount();
    }

    // ---- Handle quantity ----
    async function handleQuantity(productId, action, btn) {
      const item = cartData.items.find(i => String(i.product?._id || i.product) === String(productId));
      if (!item) return;

      const newQty = action === 'increase' ? item.quantity + 1 : item.quantity - 1;

      if (newQty < 1) {
        handleRemove(productId, btn);
        return;
      }

      const card = document.querySelector(`[data-card-id="${productId}"]`);
      card.querySelectorAll('.qty-btn').forEach(b => b.disabled = true);

      try {
        const res = await fetch(`${BASE_URL}/api/cart/update`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, quantity: newQty })
        });

        const data = await res.json();
        if (!res.ok) { showToast(data.message || 'Failed to update quantity', 'error'); return; }

        cartData = data.cart;
        renderCart();
      } catch (err) {
        console.error(err);
        showToast('Network error. Please try again.', 'error');
      } finally {
        const freshCard = document.querySelector(`[data-card-id="${productId}"]`);
        if (freshCard) freshCard.querySelectorAll('.qty-btn').forEach(b => b.disabled = false);
      }
    }

    // ---- Handle remove ----
    async function handleRemove(productId, btn) {
      const card = btn.closest('.cart-card');
      btn.disabled = true;
      btn.innerHTML = `<span style="width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block"></span>`;

      try {
        const res = await fetch(`${BASE_URL}/api/cart/remove`, {
          method: 'DELETE',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId })
        });

        const data = await res.json();
        if (!res.ok) {
          showToast(data.message || 'Failed to remove item', 'error');
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-trash"></i> Remove`;
          return;
        }

        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        card.style.opacity    = '0';
        card.style.transform  = 'translateX(30px)';

        setTimeout(() => {
          cartData = data.cart;
          renderCart();
          showToast('Item removed from cart.', 'success');
        }, 300);

      } catch (err) {
        console.error(err);
        showToast('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-trash"></i> Remove`;
      }
    }

    // ---- Load cart ----
    async function loadCart() {
      try {
        const res = await fetch(`${BASE_URL}/api/cart/get`, { method: 'GET', credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load cart');

        const data = await res.json();
        cartData = data.cart || { items: [] };
        renderCart();

      } catch (err) {
        console.error(err);
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('cart-items-list').innerHTML = `
          <div style="text-align:center;padding:4rem 1rem">
            <i class="bi bi-exclamation-triangle" style="font-size:3rem;color:var(--danger);display:block;margin-bottom:1rem"></i>
            <div style="font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:2px;color:var(--danger);margin-bottom:0.5rem">FAILED TO LOAD</div>
            <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem">Please check your connection and try again.</p>
            <button onclick="loadCart()" style="background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0.5rem 1.5rem;border-radius:8px;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:1.5px;cursor:pointer">RETRY</button>
          </div>`;
        document.getElementById('cart-content').style.display = 'block';
      }
    }

    // ---- Checkout ----
    document.getElementById('checkoutBtn').onclick = () => {
      showToast('Checkout coming soon!', 'success');
    };

    // ---- Logout ----
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch(`${BASE_URL}/api/user/logout`, { method: 'POST', credentials: 'include' });
        window.location.href = '/';
      } catch { alert('Logout failed. Please try again.'); }
    });

    loadCart();
  </script>
</body>
</html>
