<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PC Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg: #07090d;
      --surface: #0d1117;
      --card: #111820;
      --border: #1e2d3d;
      --accent: #00d4ff;
      --accent2: #0055ff;
      --success: #00e676;
      --danger: #ff4444;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* grid lines bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top bar ── */
    .top-bar {
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--accent);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: var(--danger);
      color: white;
    }

    /* ── Main ── */
    .main {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 6rem;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 2.75rem;
      animation: fadeUp 0.55s ease both;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 212, 255, 0.07);
      border: 1px solid rgba(0, 212, 255, 0.2);
      color: var(--accent);
      font-family: 'Orbitron', monospace;
      font-size: 0.68rem;
      letter-spacing: 2.5px;
      padding: 0.35rem 1rem;
      border-radius: 20px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(1.75rem, 5vw, 2.9rem);
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(130deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.75;
    }

    /* ── Form card ── */
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.55s ease 0.08s both;
      position: relative;
      overflow: hidden;
    }

    .form-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .field {
      margin-bottom: 1.5rem;
    }

    .field-label {
      display: block;
      font-family: 'Orbitron', monospace;
      font-size: 0.68rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      border-radius: 10px;
      font-size: 0.93rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .form-input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    .form-textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.93rem;
      font-family: 'DM Sans', sans-serif;
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }

    .form-textarea::placeholder {
      color: var(--muted);
    }

    .btn-generate {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 35px rgba(0, 212, 255, 0.3);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    .btn-generate:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Output area ── */
    #output {
      animation: fadeUp 0.5s ease both;
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin: 0 auto 1.25rem;
    }

    .loading-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .loading-sub {
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Error state */
    .error-state {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255, 68, 68, 0.07);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      color: #ff8888;
      font-size: 0.9rem;
    }

    .error-state i {
      color: var(--danger);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* Result card */
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .result-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--success), transparent);
    }

    .result-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .result-img-fallback {
      width: 100%;
      height: 280px;
      background: linear-gradient(135deg, var(--surface), var(--card));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 3.5rem;
    }

    .result-body {
      padding: 1.75rem;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .result-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .result-badge {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: var(--success);
      font-family: 'Orbitron', monospace;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .spec-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      transition: border-color 0.2s;
    }

    .spec-item:hover {
      border-color: rgba(0, 212, 255, 0.25);
    }

    .spec-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .spec-value {
      font-size: 0.87rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .price-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      color: var(--muted);
    }

    .price-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .qty-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 212, 255, 0.08);
    }

    .qty-value {
      min-width: 32px;
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }

    .btn-add-to-cart {
      flex: 1;
      min-width: 160px;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, #00b84a, var(--success));
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-add-to-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 230, 118, 0.3);
    }

    .btn-add-to-cart:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 560px) {
      .specs-grid {
        grid-template-columns: 1fr;
      }

      .top-bar {
        padding: 1rem;
      }

      .hero h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="top-bar">
    <a href="/pcbuilder" class="logo">
      <i class="bi bi-cpu-fill"></i> AI PC BUILDER
    </a>
    <div class="top-right">
      <a href="/product" class="nav-link"><i class="bi bi-grid"></i> Catalog</a>
      <a href="/cart" class="nav-link"><i class="bi bi-cart3"></i> Cart</a>
      <button class="btn-logout" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>

  <div class="main">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-pill">
        <i class="bi bi-stars"></i> POWERED BY AI
      </div>
      <h1>Build Your Perfect PC</h1>
      <p>Enter your budget and describe what you need. Our AI will engineer the ideal build tailored just for you.</p>
    </div>

    <!-- Form -->
    <div class="form-card">

      <div class="field">
        <label class="field-label" for="budget">
          <i class="bi bi-cash-stack"></i> Budget (PHP)
        </label>
        <div class="input-wrap">
          <i class="bi bi-currency-exchange icon"></i>
          <input class="form-input" type="number" id="budget" placeholder="e.g. 30000"
            onkeydown="return !['e','E','+','-'].includes(event.key)" />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="description">
          <i class="bi bi-chat-text"></i> Description
        </label>
        <textarea class="form-textarea" id="description"
          placeholder="e.g. Gaming PC for 1080p, video editing workstation, budget office build..."></textarea>
      </div>

      <button class="btn-generate" onclick="generateBuild()" id="generateBtn">
        <i class="bi bi-lightning-fill" style="margin-right:0.5rem"></i>
        GENERATE MY BUILD
      </button>

    </div>

    <!-- Output (controlled by aibuilder.js + overridden below) -->
    <div id="output"></div>

  </div>

  <script>
    // ----- Logout -----
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('http://localhost:3000/api/user/logout', { method: 'POST', credentials: 'include' });
        window.location.href = '/';
      } catch { alert('Logout failed. Please try again.'); }
    });

    // ----- Override generateBuild to use styled output -----
    async function generateBuild() {
      const budget = document.getElementById('budget').value;
      const description = document.getElementById('description').value;
      const output = document.getElementById('output');
      const btn = document.getElementById('generateBtn');

      if (!budget || !description.trim()) {
        output.innerHTML = `
          <div class="error-state">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Please enter both a budget and a build description.
          </div>`;
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = `<span style="display:inline-flex;align-items:center;gap:0.5rem"><span style="width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block"></span> GENERATING...</span>`;

      output.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <div class="loading-title">ANALYZING REQUIREMENTS</div>
          <div class="loading-sub">Crafting your optimal build...</div>
        </div>`;

      try {
        const response = await fetch('http://localhost:3000/api/products/build', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ budget, description })
        });

        const data = await response.json();
        console.log(data);

        if (!response.ok) {
          output.innerHTML = `
            <div class="error-state">
              <i class="bi bi-exclamation-triangle-fill"></i>
              ${data.message || 'Failed to generate build.'}
            </div>`;
          return;
        }

        const d = data.data;
        const fmt = (n) => new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(n || 0);

        output.innerHTML = `
          <div class="result-card">

            ${d.image
            ? `<img class="result-img" src="${d.image}" alt="PC Build">`
            : `<div class="result-img-fallback"><i class="bi bi-pc-display"></i></div>`
          }

            <div class="result-body">

              <div class="result-header">
                <div class="result-title"><i class="bi bi-cpu-fill" style="margin-right:0.5rem"></i>RECOMMENDED BUILD</div>
                <div class="result-badge"><i class="bi bi-check-circle-fill" style="margin-right:0.3rem"></i> AI GENERATED</div>
              </div>

              <div class="specs-grid">
                <div class="spec-item">
                  <div class="spec-label">CPU</div>
                  <div class="spec-value">${d.CPU || '—'}</div>
                </div>
                <div class="spec-item">
                  <div class="spec-label">GPU</div>
                  <div class="spec-value">${d.GPU || '—'}</div>
                </div>
                <div class="spec-item">
                  <div class="spec-label">RAM</div>
                  <div class="spec-value">${d.RAM || '—'}</div>
                </div>
                <div class="spec-item">
                  <div class="spec-label">Storage</div>
                  <div class="spec-value">${d.STORAGE || '—'}</div>
                </div>
                <div class="spec-item" style="grid-column: span 2">
                  <div class="spec-label">Case</div>
                  <div class="spec-value">${d.CASE || '—'}</div>
                </div>
              </div>

              <div class="price-row">
                <span class="price-label">TOTAL PRICE</span>
                <span class="price-value">${fmt(d.price)}</span>
              </div>
              
              <div class="qty-row">
                <div class="qty-control">
                  <button class="qty-btn" id="qtyDec">−</button>
                  <span class="qty-value" id="qtyVal">1</span>
                  <button class="qty-btn" id="qtyInc">+</button>
                </div>
                <button class="btn-add-to-cart" id="addToCartBtn">
                  <i class="bi bi-cart-plus"></i> ADD TO CART
                </button>
              </div>

            </div>
          </div>`;
        // ── Qty controls ──
        document.getElementById('qtyDec').onclick = () => {
          const el = document.getElementById('qtyVal');
          const current = parseInt(el.textContent);
          if (current > 1) el.textContent = current - 1;
        };

        document.getElementById('qtyInc').onclick = () => {
          const el = document.getElementById('qtyVal');
          el.textContent = parseInt(el.textContent) + 1;
        };

        // ----- Add to Cart -----
        document.getElementById('addToCartBtn').onclick = async () => {
          const addBtn = document.getElementById('addToCartBtn');
          const qty = parseInt(document.getElementById('qtyVal').textContent);
          const productId = d._id;

          if (!productId) {
            alert('This build has no product ID. Save it first.');
            return;
          }

          addBtn.disabled = true;
          addBtn.innerHTML = `<span style="width:14px;height:14px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block"></span> ADDING...`;

          try {
            const res = await fetch('http://localhost:3000/api/cart/add', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ productId, quantity: qty })
            });

            const cartData = await res.json();

            if (!res.ok) {
              addBtn.disabled = false;
              addBtn.innerHTML = `<i class="bi bi-cart-plus"></i> ADD TO CART`;
              alert(cartData.message || 'Failed to add to cart');
              return;
            }

            addBtn.innerHTML = `<i class="bi bi-check-circle-fill"></i> ADDED ×${qty}`;
            addBtn.style.background = 'linear-gradient(135deg, #005fa3, #00d4ff)';

          } catch (err) {
            console.error(err);
            addBtn.disabled = false;
            addBtn.innerHTML = `<i class="bi bi-cart-plus"></i> ADD TO CART`;
            alert('Network error. Please try again.');
          }
        };
      } catch (err) {
        console.error(err);
        output.innerHTML = `
          <div class="error-state">
            <i class="bi bi-wifi-off"></i>
            Failed to connect. Make sure your backend is running.
          </div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-lightning-fill" style="margin-right:0.5rem"></i> GENERATE MY BUILD`;
      }
    }
  </script>

</body>

</html>
