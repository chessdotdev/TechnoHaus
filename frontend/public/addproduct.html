<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechnoHaus – Next-gen AI-powered PC builder and e-commerce platform.">
  <meta name="theme-color" content="#00d4ff">
  <meta name="author" content="TechnoHaus">
  <meta property="og:title" content="TechnoHaus">
  <meta property="og:description" content="Next-gen AI-powered PC builder and e-commerce platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://technohaus.onrender.com">
  <meta name="application-name" content="TechnoHaus">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TechnoHaus">
  <link rel="icon" type="image/x-icon" href="../assets/image/favicon/technohauslogo.jpg"> 
  <title>Admin – Add Product | TechnoHaus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/style/global.css">
  <link rel="stylesheet" href="../assets/style/addproduct.css">
  <link rel="stylesheet" href="../assets/style/mobile.css">
</head>
<body>

  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:1rem">
      <a href="/addproduct" class="logo"><i class="bi bi-cpu-fill"></i> TECHNOHAUS</a>
      <span class="admin-badge"><i class="bi bi-shield-fill"></i> ADMIN</span>
    </div>
    <div class="top-right">
      <button class="btn-logout" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>

  <div class="main">

    <div class="page-header">
      <div class="page-pill"><i class="bi bi-tools"></i> ADMIN PANEL</div>
      <h1>Product Management</h1>
      <p>Add, edit, and manage product listings</p>
    </div>

    <!-- ── Add Product Form ── -->
    <div class="form-card">
      <div class="form-title"><i class="bi bi-plus-circle"></i> ADD NEW PRODUCT</div>

      <div class="form-error" id="form-error">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span id="form-error-text"></span>
      </div>

      <form id="addProducts-form">
        <div class="input-group">
          <label><i class="bi bi-tag"></i> CATEGORY</label>
          <select id="category">
            <option value="PC Build">PC Build</option>
            <option value="Peripheral">Peripheral</option>
            <option value="Monitor">Monitor</option>
            <option value="Component">Component</option>
          </select>
        </div>

        <div class="fields-pcbuild active" id="fields-pcbuild">
          <div class="input-group">
            <label><i class="bi bi-cpu"></i> CPU</label>
            <input type="text" id="CPU" placeholder="e.g. Intel i7-13700K">
          </div>
          <div class="input-group">
            <label><i class="bi bi-gpu-card"></i> GPU</label>
            <input type="text" id="GPU" placeholder="e.g. RTX 4070 Ti">
          </div>
          <div class="input-row">
            <div class="input-group">
              <label><i class="bi bi-memory"></i> RAM</label>
              <input type="text" id="RAM" placeholder="e.g. 32GB DDR5">
            </div>
            <div class="input-group">
              <label><i class="bi bi-device-ssd"></i> STORAGE</label>
              <input type="text" id="STORAGE" placeholder="e.g. 1TB NVMe">
            </div>
          </div>
          <div class="input-group">
            <label><i class="bi bi-box"></i> PC CASE</label>
            <input type="text" id="CASE" placeholder="e.g. NZXT H510">
          </div>
        </div>

        <div class="fields-other" id="fields-other">
          <div class="input-group">
            <label><i class="bi bi-tag"></i> PRODUCT NAME</label>
            <input type="text" id="name" placeholder="e.g. Logitech G Pro X">
          </div>
          <div class="input-group">
            <label><i class="bi bi-building"></i> BRAND</label>
            <input type="text" id="brand" placeholder="e.g. Logitech">
          </div>
          <div class="input-group">
            <label><i class="bi bi-card-text"></i> DESCRIPTION</label>
            <textarea id="description" placeholder="Short product description..."></textarea>
          </div>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label><i class="bi bi-currency-dollar"></i> PRICE (₱)</label>
            <input type="number" id="product-price" placeholder="e.g. 75000">
          </div>
          <div class="input-group">
            <label><i class="bi bi-image"></i> IMAGE URL</label>
            <input type="text" id="product-image" placeholder="https://...">
          </div>
        </div>

        <div class="img-preview" id="img-preview">
          <div class="img-preview-placeholder">
            <i class="bi bi-card-image"></i>
            <span>Preview will appear here</span>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <i class="bi bi-plus-lg"></i> ADD PRODUCT
        </button>
      </form>
    </div>

    <!-- ── Products Panel ── -->
    <div class="products-panel">

      <div class="panel-header">
        <div class="panel-title"><i class="bi bi-grid-3x3-gap"></i> ALL PRODUCTS</div>
        <span class="product-count" id="product-count">0 products</span>
      </div>

      <!-- Controls bar — all in one row -->
      <div class="controls-bar">
        <div class="search-wrap">
          <i class="bi bi-search"></i>
          <input type="text" class="search-input" id="search-input" placeholder="Search by name, CPU, GPU, brand...">
        </div>
        <!-- Desktop selects -->
        <select class="filter-select" id="filter-category">
          <option value="">ALL CATEGORIES</option>
          <option value="PC Build">PC BUILD</option>
          <option value="Peripheral">PERIPHERAL</option>
          <option value="Monitor">MONITOR</option>
          <option value="Component">COMPONENT</option>
        </select>
        <select class="filter-select" id="filter-sort">
          <option value="">SORT: DEFAULT</option>
          <option value="price-asc">PRICE: LOW → HIGH</option>
          <option value="price-desc">PRICE: HIGH → LOW</option>
          <option value="newest">NEWEST FIRST</option>
        </select>
        <!-- Mobile buttons -->
        <button class="btn-filter" id="btn-filter" onclick="openSheet('filter-sheet')">
          <i class="bi bi-sliders"></i> FILTER
          <span class="filter-badge" id="filter-badge">0</span>
        </button>
        <button class="btn-sort" id="btn-sort" onclick="openSheet('sort-sheet')">
          <i class="bi bi-arrow-down-up"></i> SORT
        </button>
      </div>

      <div class="product-grid" id="product-grid">
        <div class="product-card"><div class="skeleton" style="height:160px"></div><div class="card-body"><div class="skeleton mb-2" style="height:11px;width:70%"></div><div class="skeleton mb-2" style="height:9px"></div><div class="skeleton" style="height:30px;border-radius:7px;margin-top:0.75rem"></div></div></div>
        <div class="product-card"><div class="skeleton" style="height:160px"></div><div class="card-body"><div class="skeleton mb-2" style="height:11px;width:60%"></div><div class="skeleton mb-2" style="height:9px;width:90%"></div><div class="skeleton" style="height:30px;border-radius:7px;margin-top:0.75rem"></div></div></div>
        <div class="product-card"><div class="skeleton" style="height:160px"></div><div class="card-body"><div class="skeleton mb-2" style="height:11px;width:75%"></div><div class="skeleton mb-2" style="height:9px;width:85%"></div><div class="skeleton" style="height:30px;border-radius:7px;margin-top:0.75rem"></div></div></div>
      </div>

    </div>
  </div>

  <!-- Overlay -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>

  <!-- Filter Bottom Sheet -->
  <div class="bottom-sheet" id="filter-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title"><i class="bi bi-sliders"></i> FILTER</div>
      <button class="sheet-close" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sheet-body">
      <div class="sheet-section">
        <div class="sheet-section-title">CATEGORY</div>
        <button class="cat-option active" data-cat=""           onclick="selectCat(this, '')">All Categories</button>
        <button class="cat-option" data-cat="PC Build"   onclick="selectCat(this, 'PC Build')">PC Build</button>
        <button class="cat-option" data-cat="Peripheral" onclick="selectCat(this, 'Peripheral')">Peripheral</button>
        <button class="cat-option" data-cat="Monitor"    onclick="selectCat(this, 'Monitor')">Monitor</button>
        <button class="cat-option" data-cat="Component"  onclick="selectCat(this, 'Component')">Component</button>
      </div>
      <div class="sheet-section">
        <div class="sheet-section-title">PRICE RANGE (₱)</div>
        <div class="price-inputs">
          <input type="number" class="price-input" id="min-price" placeholder="Min price">
          <input type="number" class="price-input" id="max-price" placeholder="Max price">
        </div>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn-reset" onclick="resetFilters()">RESET</button>
      <button class="btn-apply" onclick="applySheetFilters()">APPLY</button>
    </div>
  </div>

  <!-- Sort Bottom Sheet -->
  <div class="bottom-sheet" id="sort-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title"><i class="bi bi-arrow-down-up"></i> SORT BY</div>
      <button class="sheet-close" onclick="closeSheet()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sheet-body">
      <button class="sort-option active" data-sort=""           onclick="selectSort(this, '')">Default</button>
      <button class="sort-option" data-sort="price-asc"  onclick="selectSort(this, 'price-asc')">Price: Low → High</button>
      <button class="sort-option" data-sort="price-desc" onclick="selectSort(this, 'price-desc')">Price: High → Low</button>
      <button class="sort-option" data-sort="newest"     onclick="selectSort(this, 'newest')">Newest First</button>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../assets/script/addproduct.js"></script>
  <script src="../assets/script/drag.sheet.js"></script>
</body>
</html>
